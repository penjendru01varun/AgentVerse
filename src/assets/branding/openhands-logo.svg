<svg width="47" height="30" viewBox="0 0 94 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Stylish V shape with gradient and glow -->
  <defs>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Left arm of V -->
  <path d="M8 6 L38 54 L47 54 L22 6 Z" fill="url(#vGrad)" filter="url(#glow)" rx="2"/>
  <!-- Right arm of V -->
  <path d="M86 6 L56 54 L47 54 L72 6 Z" fill="url(#vGrad)" filter="url(#glow)" rx="2"/>
  <!-- Accent dot at bottom -->
  <circle cx="47" cy="54" r="3.5" fill="white" opacity="0.9"/>
</svg>
